name: Mathematical audit
description: Report a possible gap, omitted case, inconsistency, circular check, or overstatement.
title: "[Mathematical audit]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for stress-testing the release. The canonical release is `v0.1.0` plus its peeled 40-character commit SHA. `release-v0.1.0` is a mutable launcher only. Archive-only provenance is **UNVERIFIED** unless the tag-to-commit mapping was independently established.

  - type: input
    id: release_identity
    attributes:
      label: Reviewed release identity
      description: Give the tag, peeled 40-character commit SHA, and provenance status.
      placeholder: v0.1.0 → 0123456789abcdef0123456789abcdef01234567 (VERIFIED)
    validations:
      required: true

  - type: input
    id: ci_receipt
    attributes:
      label: CI receipt
      description: Paste the exact Release CI run URL and its 40-character head SHA; write UNVERIFIED if no matching run was available.
      placeholder: https://github.com/emad-ii/cubic-anomaly-standard-model/actions/runs/123456789 — head 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker — invalidates the central theorem or release integrity
        - Major — invalidates a material lemma, case, or advertised evidence surface
        - Minor — local error that does not change the central result
        - Question — clarification needed before severity can be assessed
    validations:
      required: true

  - type: input
    id: claim
    attributes:
      label: Claim ID
      description: Use an MP-, E6-, EX-, or PH- identifier from docs/CLAIM_STATUS.md.
      placeholder: E6-08
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Exact source location
      description: Give the paper page and proposition/equation, or repository path and line.
      placeholder: paper/paper.pdf, p. 17, Theorem 4.2
    validations:
      required: true

  - type: dropdown
    id: evidence
    attributes:
      label: Evidence surface under review
      options:
        - P — proved in the manuscript
        - L — Lean checked
        - C2 — independently reproduced
        - C1 — exactly computed
        - I — interpretive or conditional
        - Cross-surface consistency
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Finding and reasoning
      description: State the smallest precise claim that may fail and provide the argument, counterexample, omitted case, or circular dependency.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction or derivation
      description: Give the shortest command, calculation, or derivation that exposes the issue. Attach minimal artefacts where useful.

  - type: textarea
    id: impact
    attributes:
      label: Downstream impact
      description: Which later statements would need revision if this finding is correct?
    validations:
      required: true

  - type: textarea
    id: resolution
    attributes:
      label: Suggested resolution
      description: Optional proposed correction, additional lemma, or verification step.

  - type: checkboxes
    id: declarations
    attributes:
      label: Review declarations
      options:
        - label: I reviewed the recorded peeled commit, not the README or mutable launcher branch alone.
          required: true
        - label: I independently verified the tag-to-commit mapping, or marked release provenance UNVERIFIED.
          required: true
        - label: I recorded the exact CI run URL and head SHA and compared it with the peeled commit, or marked CI evidence UNVERIFIED.
          required: true
        - label: I distinguished manuscript proof, Lean checking, exact computation, and interpretation.
          required: true
        - label: I have disclosed any material conflict of interest in the finding above.
          required: true
